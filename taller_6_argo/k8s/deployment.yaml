apiVersion: apps/v1
kind: Deployment
metadata:
  name: taller6-housing
  labels:
    app: taller6-housing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taller6-housing
  template:
    metadata:
      labels:
        app: taller6-housing
    spec:
      containers:
        - name: api
          image: crissebasbol/taller6-housing
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
