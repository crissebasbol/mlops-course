services:
  jupyter:
    build: jupyter
    container_name: jupyter-notebook
    ports:
      - "8001:8888"
    volumes:
      - ./shared_storage/:/home/jovyan/work
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''

  api:
    build: api
    container_name: penguin-api
    ports:
      - "8025:8989"
    volumes:
      # Modelos versionados que genera el notebook (solo lectura para el api)
      - ./shared_storage/models/:/models:ro
    environment:
      - MODELS_DIR=/models
