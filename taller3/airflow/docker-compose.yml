x-airflow-common: &airflow-common
  build: .
  image: taller3/airflow:2.10.5
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Metadatos de Airflow -> base de datos EXCLUSIVA para metadatos
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Conexion de Airflow hacia la base de datos DE DATOS (la usan los DAGs).
    AIRFLOW_CONN_MLOPS_DATA: postgresql://postgres:admin123@postgres-data:5432/penguins
    # Rutas usadas por el DAG
    # El CSV viene dentro de la imagen (ver Dockerfile), no se monta nada.
    PENGUINS_CSV_PATH: /opt/airflow/data/penguins.csv
    MODELS_DIR: /opt/airflow/models
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow-logs-volume:/opt/airflow/logs
    - models-volume:/opt/airflow/models
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy
    postgres-data:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:16
    container_name: taller3-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: taller3-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: taller3-airflow-webserver
    command: webserver
    ports:
      - "8023:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: taller3-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  # Metadatos de Airflow
  airflow-db-volume:
  # Logs de Airflow (DAGs, tareas, etc)
  airflow-logs-volume:
  # Modelos entrenados por el DAG.
  models-volume:
