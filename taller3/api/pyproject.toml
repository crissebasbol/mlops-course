[project]
name = "api"
version = "0.1.0"
description = "API de inferencia para los modelos entrenados por Airflow"
readme = "README.md"
authors = [
    { name = "Cristhian Bolanos", email = "crissebasbol@gmail.com" }
]
requires-python = ">=3.11"
# scikit-learn, numpy y joblib se fijan a la misma version que usa la imagen de
# Airflow (airflow/requirements.txt) para que los .pkl carguen sin advertencias.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "joblib==1.4.2",
    "numpy==2.1.3",
    "scikit-learn==1.5.2",
    "scipy",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
