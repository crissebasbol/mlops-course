[project]
name = "source-app"
version = "0.1.0"
description = "Replica local de la Data API del proyecto, servida desde Postgres"
readme = "README.md"
authors = [
    { name = "Cristhian Bolanos", email = "crissebasbol@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
