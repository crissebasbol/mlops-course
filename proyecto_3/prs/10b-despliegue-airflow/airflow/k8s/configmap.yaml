apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  PIPELINE_SCHEDULE: "*/15 * * * *"
  DATA_API_URL: http://data-api
  DATA_API_GROUP: "1"
  DATA_API_DAY: Tuesday
  END_OF_DATA_POLICY: restart
  DATA_DB_HOST: postgres-data
  DATA_DB_NAME: housing
  DATA_DB_USER: airflow_etl
  S3_ENDPOINT_URL: http://minio:9000
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT: housing-price
  MODEL_NAME: housing-price-model
  MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
