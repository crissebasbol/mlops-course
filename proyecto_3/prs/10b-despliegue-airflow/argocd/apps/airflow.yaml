apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.22.0
      helm:
        releaseName: airflow
        valueFiles:
          - $values/airflow/values.yaml
    - repoURL: https://github.com/crissebasbol/housing-price-mlops.git
      targetRevision: master
      ref: values
    - repoURL: https://github.com/crissebasbol/housing-price-mlops.git
      targetRevision: master
      path: airflow/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: housing-mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
