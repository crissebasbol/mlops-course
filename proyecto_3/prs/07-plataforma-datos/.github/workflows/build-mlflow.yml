name: Build MLflow

on:
  push:
    branches: [master]
    paths:
      - mlflow/Dockerfile
      - mlflow/start.sh
      - .github/workflows/build-mlflow.yml
      - .github/workflows/_build-push.yml
  pull_request:
    paths:
      - mlflow/Dockerfile
      - mlflow/start.sh
      - .github/workflows/build-mlflow.yml
      - .github/workflows/_build-push.yml
  workflow_dispatch:

jobs:
  mlflow:
    uses: ./.github/workflows/_build-push.yml
    with:
      component: mlflow
      image: crissebasbol/housing-mlflow
      context: mlflow
      dockerfile: mlflow/Dockerfile
      manifest: mlflow/k8s/deployment.yaml
      yq_path: .spec.template.spec.containers[0].image
    secrets: inherit
