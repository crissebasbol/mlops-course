name: Build and push image

on:
  workflow_call:
    inputs:
      component:
        description: Nombre corto del componente (para mensajes y caché)
        required: true
        type: string
      image:
        description: Repositorio en DockerHub, sin tag
        required: true
        type: string
      context:
        description: Contexto de build
        required: true
        type: string
      dockerfile:
        description: Ruta del Dockerfile
        required: true
        type: string
      manifest:
        description: Archivo que referencia la imagen y se actualiza con el tag nuevo
        required: true
        type: string
      yq_path:
        description: Ruta yq del campo a actualizar en el manifiesto
        required: true
        type: string
      value:
        description: "image (repositorio:tag) o tag (solo el tag)"
        required: false
        type: string
        default: image
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DEPLOY_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}

  update-manifest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Update image tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
          IMAGE: ${{ inputs.image }}
          MANIFEST: ${{ inputs.manifest }}
          YQ_PATH: ${{ inputs.yq_path }}
          VALUE: ${{ inputs.value }}
        run: |
          if [ "$VALUE" = "tag" ]; then new="$TAG"; else new="$IMAGE:$TAG"; fi
          yq -i "${YQ_PATH} = \"${new}\"" "$MANIFEST"
          git diff --stat

      - name: Commit and push
        env:
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Imagen ${COMPONENT} ${TAG} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep $((attempt * 5))
          done
          exit 1
