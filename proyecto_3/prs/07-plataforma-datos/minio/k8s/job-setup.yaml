apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        mlops/tier: data
      containers:
        - name: mc
          image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
          command: ["/bin/sh", "/setup/setup.sh"]
          envFrom:
            - secretRef:
                name: minio-root
          env:
            - name: MLFLOW_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: minio-mlflow, key: AWS_ACCESS_KEY_ID}
            - name: MLFLOW_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: minio-mlflow, key: AWS_SECRET_ACCESS_KEY}
            - name: AIRFLOW_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: minio-airflow, key: AWS_ACCESS_KEY_ID}
            - name: AIRFLOW_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: minio-airflow, key: AWS_SECRET_ACCESS_KEY}
            - name: LOCUST_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: minio-locust, key: AWS_ACCESS_KEY_ID}
            - name: LOCUST_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: minio-locust, key: AWS_SECRET_ACCESS_KEY}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: setup
              mountPath: /setup
            - name: policies
              mountPath: /policies
      volumes:
        - name: setup
          configMap:
            name: minio-setup
        - name: policies
          configMap:
            name: minio-policies
