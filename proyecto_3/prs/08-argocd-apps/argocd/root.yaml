apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: housing-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/crissebasbol/housing-price-mlops.git
    targetRevision: master
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
