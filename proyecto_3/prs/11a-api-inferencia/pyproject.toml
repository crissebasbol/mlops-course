[project]
name = "housing-price-mlops"
version = "0.1.0"
description = "Continuous training MLOps platform for housing price prediction"
requires-python = ">=3.12,<3.13"
dependencies = ["housing-ml"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.17.6",
    "requests>=2.32",
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
]

[tool.uv]
package = false

[tool.uv.sources]
housing-ml = { workspace = true }

[tool.uv.workspace]
members = ["housing_ml"]

[tool.pytest.ini_options]
testpaths = ["housing_ml/tests", "airflow/tests", "api/tests"]
pythonpath = ["airflow/dags", "api"]
