apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      nodeSelector:
        mlops/tier: serving
      containers:
        - name: api
          image: crissebasbol/housing-api:bootstrap
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: api
          env:
            - name: DATA_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-data, key: API_WRITER_PASSWORD}
            - name: API_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: api-admin, key: token}
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
