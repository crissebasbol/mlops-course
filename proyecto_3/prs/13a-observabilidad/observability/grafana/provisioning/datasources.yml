apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s

  - name: Housing Postgres
    uid: housing-postgres
    type: grafana-postgresql-datasource
    url: postgres-data:5432
    user: app_reader
    editable: false
    jsonData:
      database: housing
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 2
    secureJsonData:
      password: $HOUSING_DB_PASSWORD
