        {
          "id": 29,
          "type": "timeseries",
          "title": "MAPE en línea del replay (champion vs sombra)",
          "description": "Predicciones de Locust con X-Traffic-Source: replay unidas a su precio real (vista audit.replay_accuracy).",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "housing-postgres"
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "housing-postgres"
              },
              "rawSql": "SELECT minute AS \"time\",\n       sum(champion_mape * requests) / sum(requests) AS \"MAPE champion\",\n       avg(shadow_mape) AS \"MAPE sombra\"\nFROM audit.replay_accuracy\nWHERE $__timeFilter(minute)\nGROUP BY 1\nORDER BY 1",
              "format": "time_series",
              "rawQuery": true,
              "editorMode": "code",
              "refId": "A"
