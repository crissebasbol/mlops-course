apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  labels:
    app: locust
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      nodeSelector:
        mlops/tier: data
      initContainers:
        - name: replay-sample
          image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
          command:
            - sh
            - -c
            - |
              until mc cp -q replay/datasets/replay/holdout_sample.json /data/holdout_sample.json; do
                echo "Todavía no está la muestra de replay; reintento en 30 s"
                sleep 30
              done
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: minio-locust, key: AWS_ACCESS_KEY_ID}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: minio-locust, key: AWS_SECRET_ACCESS_KEY}
            - name: MC_HOST_replay
              value: http://$(AWS_ACCESS_KEY_ID):$(AWS_SECRET_ACCESS_KEY)@minio:9000
            - name: MC_CONFIG_DIR
              value: /tmp/mc
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: locust
          image: locustio/locust:2.46.7
          args:
            - -f
            - /locust/locustfile.py
            - --host
            - http://api:8000
          env:
            - name: REPLAY_SAMPLE_PATH
              value: /data/holdout_sample.json
          ports:
            - name: web
              containerPort: 8089
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: locustfile
              mountPath: /locust
            - name: data
              mountPath: /data
      volumes:
        - name: locustfile
          configMap:
            name: locustfile
        - name: data
          emptyDir:
            sizeLimit: 50Mi
