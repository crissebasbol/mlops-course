apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - k8s/secret.yaml
  - k8s/service.yaml
  - k8s/statefulset.yaml

configMapGenerator:
  - name: postgres-data-init
    files:
      - init/01_roles.sh
      - init/02_tables.sql

generatorOptions:
  disableNameSuffixHash: true
