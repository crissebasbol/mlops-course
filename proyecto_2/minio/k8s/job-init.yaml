apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app: minio-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        mlops/tier: data
      containers:
        - name: mc
          image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "esperando a MinIO..."; sleep 5
              done
              mc mb --ignore-existing local/mlflows3
              mc mb --ignore-existing local/datasets
              mc ls local
          envFrom:
            - secretRef:
                name: minio-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
