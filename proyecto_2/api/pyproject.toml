[project]
name = "api"
version = "1.0.0"
description = "API de inferencia de readmision de pacientes diabeticos que carga el modelo champion desde MLflow"
authors = [
    { name = "Cristhian Bolanos", email = "crissebasbol@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "mlflow-skinny==3.16.1",
    "skops",
    "scikit-learn==1.9.1",
    "pandas",
    "prometheus-client",
    "psycopg[binary,pool]",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
