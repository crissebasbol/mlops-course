apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-pipeline
data:
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT: diabetes_readmission
  MODEL_NAME: diabetes_readmission
  MIN_IMPROVEMENT: "0.0"
  DATA_DB_HOST: postgres-data
  DATA_DB_PORT: "5432"
